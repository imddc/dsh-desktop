name: Release

# 打 tag（如 v0.2.0）即触发：构建捆绑版 .app/.dmg 并发布 GitHub Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 允许手动触发，方便测试

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Prepare bundled runtime (node + dsh)
        run: node scripts/prepare-runtime.mjs
        env:
          NODE_VERSION: v24.19.0
          DSH_VERSION: latest

      - name: Build Tauri app (bundled)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "dsh-desktop ${{ github.ref_name }}"
          releaseBody: |
            DeepSeek Harness 桌面客户端（捆绑运行时，开箱即用）。

            安装：下载 `.dmg`，双击后把 `dsh-desktop.app` 拖入 Applications。
            > 未签名应用：首次打开如被 Gatekeeper 拦截，右键 → 打开。
          releaseDraft: false
          prerelease: false
