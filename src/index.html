<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0d1117;
        color: #e6edf3;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .container {
        text-align: center;
        max-width: 480px;
        padding: 32px;
      }
      .logo {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        display: block;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }
      p.status {
        font-size: 14px;
        color: #8b949e;
        min-height: 20px;
        margin-bottom: 24px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto;
        border: 3px solid #21262d;
        border-top-color: #4c9aff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: #ff7b72;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        background: rgba(248, 81, 73, 0.08);
        border: 1px solid rgba(248, 81, 73, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        text-align: left;
        margin-bottom: 16px;
        display: none;
      }
      .hint {
        font-size: 12px;
        color: #484f58;
        margin-top: 24px;
        line-height: 1.7;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <img
        class="logo"
        src="/assets/tauri.svg"
        alt="logo"
        onerror="this.style.display='none'"
      />
      <h1>DeepSeek Harness</h1>
      <p class="status" id="status">正在启动本地服务…</p>
      <div class="spinner" id="spinner"></div>
      <div class="error" id="error"></div>
      <p class="hint" id="hint"></p>
    </main>

    <script>
      const statusEl = document.getElementById("status");
      const spinnerEl = document.getElementById("spinner");
      const errorEl = document.getElementById("error");

      function showError(msg) {
        spinnerEl.classList.add("hidden");
        errorEl.textContent = msg;
        errorEl.style.display = "block";
        statusEl.textContent = "启动失败";
        document.getElementById("hint").textContent =
          "提示：可通过环境变量 DSH_CLIENT_DSH_BIN 指定 dsh 路径，DSH_CLIENT_NODE_BIN 指定 node 路径，DSH_CLIENT_WORKSPACE 指定工作目录。";
      }

      async function poll() {
        try {
          const res = await window.__TAURI__.core.invoke("boot_status");
          if (res.status === "ready") {
            statusEl.textContent = "服务已就绪，正在打开…";
            window.location.href = res.url;
            return;
          }
          if (res.status === "failed") {
            showError(res.message || "未知错误");
            return;
          }
        } catch (e) {
          showError("无法连接本地进程：" + e);
          return;
        }
        setTimeout(poll, 300);
      }

      poll();
    </script>
  </body>
</html>
