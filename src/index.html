<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsh-desktop</title>
    <link rel="stylesheet" href="/styles.css" />
    <!-- 尽早确定主题，避免首帧闪烁（跟随系统 / 浅色 / 深色） -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("dsh-theme") || "auto";
          var resolved =
            mode === "auto"
              ? matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : mode;
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div class="app">
      <!-- 自定义标题栏：左侧品牌区，右侧主题切换 + 液态玻璃三灯（X 在最右） -->
      <header class="topbar" data-tauri-drag-region>
        <div class="topbar-brand" data-tauri-drag-region>
          <img
            class="topbar-logo"
            src="/assets/whale-girl.png"
            alt="dsh-desktop"
            draggable="false"
            data-tauri-drag-region
          />
          <span class="topbar-title" data-tauri-drag-region>dsh-desktop</span>
        </div>
        <div class="topbar-actions">
          <button class="theme-toggle" id="btn-theme" type="button" data-state="auto" aria-label="主题：跟随系统">
            <svg class="icon-auto" viewBox="0 0 10 10" aria-hidden="true">
              <circle cx="5" cy="5" r="3.2" fill="none" stroke="currentColor" stroke-width="1.1" />
              <path d="M5 1.8a3.2 3.2 0 0 1 0 6.4Z" fill="currentColor" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 10 10" aria-hidden="true">
              <circle cx="5" cy="5" r="2.1" fill="none" stroke="currentColor" stroke-width="1.2" />
              <path d="M5 0.6V1.8 M5 8.2V9.4 M0.6 5H1.8 M8.2 5H9.4 M2 2L2.8 2.8 M7.2 7.2L8 8 M8 2L7.2 2.8 M2.8 7.2L2 8" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M7.6 1.3A4 4 0 1 0 8.7 8.7 3.4 3.4 0 0 1 7.6 1.3Z" fill="currentColor" />
            </svg>
          </button>
          <div class="traffic-lights">
            <button class="light light-min" id="btn-min" type="button" aria-label="最小化" title="最小化">
              <svg viewBox="0 0 10 10" aria-hidden="true">
                <path d="M2 5 H8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </button>
            <button class="light light-max" id="btn-max" type="button" aria-label="最大化" title="最大化">
              <svg viewBox="0 0 10 10" aria-hidden="true">
                <path d="M1.5 3.5 V1.5 H3.5 M6.5 1.5 H8.5 V3.5 M8.5 6.5 V8.5 H6.5 M3.5 8.5 H1.5 V6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
              </svg>
            </button>
            <button class="light light-close" id="btn-close" type="button" aria-label="关闭" title="关闭">
              <svg viewBox="0 0 10 10" aria-hidden="true">
                <path d="M1.8 1.8 L8.2 8.2 M8.2 1.8 L1.8 8.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <main class="content">
        <!-- 启动加载层 -->
        <section class="loader" id="loader">
          <img class="loader-logo" src="/assets/whale-girl.png" alt="dsh-desktop" />
          <h1>dsh-desktop</h1>
          <p class="status" id="status">正在启动本地服务…</p>
          <div class="spinner" id="spinner" role="status" aria-label="加载中"></div>
          <div class="error" id="error"></div>
        </section>

        <!-- dsh Web GUI -->
        <iframe class="gui" id="gui" title="DeepSeek Harness"></iframe>
      </main>
    </div>

    <script src="/main.js"></script>
  </body>
</html>
